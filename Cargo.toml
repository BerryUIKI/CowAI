[workspace]
members = [
    "crates/cow-core",
    "crates/cow-bus",
    "crates/cow-tools",
    "crates/cow-llm",
    "crates/cow-agent",
    "crates/cow-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CowAI Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/BerryUIKI/CowAI"

[workspace.dependencies]
# Async & runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling & logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI & utilities
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tempfile = "3.10"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Internal workspace crates
cow-core = { path = "crates/cow-core" }
cow-bus = { path = "crates/cow-bus" }
cow-tools = { path = "crates/cow-tools" }
cow-llm = { path = "crates/cow-llm" }
cow-agent = { path = "crates/cow-agent" }
