<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">CowBot workspace concept, not a shipped interface</title>
<desc id="desc">An illustrative future desktop workspace: channels on the left, a discussion with Planner and Coder in the center, a sequential task pipeline on the right, and an approval card awaiting a human decision. This is a static design concept; a desktop shell exists, but this is not its exact layout and desktop execution launch is follow-up work.</desc>
<rect width="1200" height="760" rx="20" fill="#0c1525"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="30" y="42" fill="#f8fafc" font-size="22" font-weight="700">CowBot</text><text x="132" y="42" fill="#9fb1c8" font-size="16">/ Engineering workspace</text>
<rect x="778" y="18" width="392" height="34" rx="17" fill="#463a20"/><text x="797" y="41" fill="#fcd783" font-size="14" font-weight="600">DESIGN CONCEPT · ILLUSTRATIVE LAYOUT</text>
<path d="M0 70H1200M226 70V714M900 70V714" stroke="#2b3b51"/>
<rect x="0" y="71" width="225" height="643" fill="#111e30"/>
<text x="24" y="114" fill="#92a8c1" font-size="12" letter-spacing="2">CHANNELS</text>
<rect x="12" y="132" width="201" height="41" rx="8" fill="#1b4547"/>
<text x="28" y="158" fill="#78e4d1" font-size="16"># engineering</text><text x="28" y="205" fill="#b3c3d6" font-size="16"># research</text><text x="28" y="251" fill="#b3c3d6" font-size="16"># general</text>
<text x="24" y="322" fill="#92a8c1" font-size="12" letter-spacing="2">AGENT TEAM</text>
<g font-size="16" fill="#d8e5f3"><text x="28" y="365">●  Planner</text><text x="28" y="407">●  Coder</text><text x="28" y="449">●  Reviewer</text></g>
<text x="24" y="663" fill="#8da5be" font-size="13">Local workspace</text><text x="24" y="686" fill="#8da5be" font-size="13">Illustrative content only</text>
<text x="254" y="110" fill="#f1f5f9" font-size="21" font-weight="600"># engineering</text><text x="254" y="137" fill="#95abc3" font-size="14">People and agents, working in one timeline</text>
<path d="M250 157H876" stroke="#2b3b51"/>
<circle cx="275" cy="196" r="20" fill="#324c70"/><text x="268" y="202" fill="#fff" font-size="16">H</text>
<text x="312" y="188" fill="#f1f5f9" font-size="15" font-weight="700">Human</text><text x="312" y="215" fill="#c6d5e7" font-size="16">@team Plan a small command-line calculator.</text>
<circle cx="275" cy="279" r="20" fill="#23615b"/><text x="269" y="285" fill="#fff" font-size="16">P</text>
<text x="312" y="270" fill="#77dfcb" font-size="15" font-weight="700">Planner</text><text x="312" y="298" fill="#c6d5e7" font-size="16">Define the parser, implement operations, test errors.</text>
<rect x="312" y="317" width="540" height="48" rx="8" fill="#172c40"/><text x="330" y="347" fill="#b6d8f7" font-size="14">Deliverable / implementation-plan.md</text>
<circle cx="275" cy="410" r="20" fill="#3c4876"/><text x="269" y="416" fill="#fff" font-size="16">C</text>
<text x="312" y="402" fill="#b7c5ff" font-size="15" font-weight="700">Coder</text><text x="312" y="430" fill="#c6d5e7" font-size="16">Ready to run the proposed verification command.</text>
<rect x="312" y="451" width="540" height="164" rx="10" fill="#262b31" stroke="#9b7839"/>
<text x="332" y="481" fill="#f7ce82" font-size="15" font-weight="700">APPROVAL REQUEST · EXAMPLE</text><text x="332" y="512" fill="#dce5ef" font-size="15">execute_code</text><text x="332" y="540" fill="#b7c5d8" font-size="15" font-family="Consolas,monospace">cargo test --workspace</text>
<rect x="332" y="562" width="101" height="34" rx="7" fill="#267a6e"/><text x="352" y="584" fill="#fff" font-size="14">Approve</text><rect x="447" y="562" width="101" height="34" rx="7" fill="#3b4656"/><text x="475" y="584" fill="#dfe7f1" font-size="14">Reject</text>
<rect x="254" y="649" width="618" height="43" rx="9" fill="#17263b" stroke="#354b65"/><text x="272" y="676" fill="#92a8c1" font-size="14">Message the team or mention an agent…</text>
<text x="925" y="111" fill="#eff6ff" font-size="17" font-weight="700">Task pipeline</text><text x="925" y="140" fill="#95abc3" font-size="13">Sequential crew / example</text>
<g font-size="15"><text x="925" y="198" fill="#72d9bf">01  Plan · complete</text><text x="925" y="244" fill="#f7ce82">02  Build · awaiting approval</text><text x="925" y="290" fill="#a4b6ce">03  Review · pending</text></g>
<path d="M925 324H1174" stroke="#2b3b51"/><text x="925" y="358" fill="#e2e8f0" font-size="15" font-weight="600">Workspace direction</text><g font-size="14" fill="#a4b6ce"><text x="925" y="390">Persistent channels</text><text x="925" y="420">Visible task progress</text><text x="925" y="450">Human tool approvals</text><text x="925" y="480">Shared deliverables</text></g>
<text x="30" y="743" fill="#a8bdd3" font-size="14">CONCEPT PREVIEW   /   Desktop shell exists. This layout is illustrative; starting execution from desktop remains follow-up work.</text>
</g></svg>
