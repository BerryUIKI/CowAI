<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">CowBot workspace concept, not a shipped interface</title>
<desc id="desc">An illustrative future desktop workspace: channels on the left, a discussion with Planner and Coder in the center, a sequential task pipeline on the right, and an approval card awaiting a human decision. This is a static design concept; a desktop shell exists, but this is not its exact layout and desktop execution launch is follow-up work.</desc>
<rect width="1200" height="760" rx="20" fill="#f7f5f0"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="30" y="42" fill="#272622" font-size="22" font-weight="700">CowBot</text><text x="132" y="42" fill="#6b655c" font-size="16">/ Engineering workspace</text>
<rect x="778" y="18" width="392" height="34" rx="17" fill="#f3e2b8"/><text x="797" y="41" fill="#8a5a00" font-size="14" font-weight="600">DESIGN CONCEPT · ILLUSTRATIVE LAYOUT</text>
<path d="M0 70H1200M226 70V714M900 70V714" stroke="#d6d0c6"/>
<rect x="0" y="71" width="225" height="643" fill="#ece8e0"/>
<text x="24" y="114" fill="#6b655c" font-size="12" letter-spacing="2">CHANNELS</text>
<rect x="12" y="132" width="201" height="41" rx="8" fill="#d3ece7"/>
<text x="28" y="158" fill="#0f7b6c" font-size="16"># engineering</text><text x="28" y="205" fill="#3a3631" font-size="16"># research</text><text x="28" y="251" fill="#3a3631" font-size="16"># general</text>
<text x="24" y="322" fill="#6b655c" font-size="12" letter-spacing="2">AGENT TEAM</text>
<g font-size="16" fill="#272622"><text x="28" y="365">●  Planner</text><text x="28" y="407">●  Coder</text><text x="28" y="449">●  Reviewer</text></g>
<text x="24" y="663" fill="#6b655c" font-size="13">Local workspace</text><text x="24" y="686" fill="#6b655c" font-size="13">Illustrative content only</text>
<text x="254" y="110" fill="#272622" font-size="21" font-weight="600"># engineering</text><text x="254" y="137" fill="#6b655c" font-size="14">People and agents, working in one timeline</text>
<path d="M250 157H876" stroke="#d6d0c6"/>
<circle cx="275" cy="196" r="20" fill="#4a6a94"/><text x="268" y="202" fill="#ffffff" font-size="16">H</text>
<text x="312" y="188" fill="#272622" font-size="15" font-weight="700">Human</text><text x="312" y="215" fill="#3a3631" font-size="16">@team Plan a small command-line calculator.</text>
<circle cx="275" cy="279" r="20" fill="#1f8a7a"/><text x="269" y="285" fill="#ffffff" font-size="16">P</text>
<text x="312" y="270" fill="#0f7b6c" font-size="15" font-weight="700">Planner</text><text x="312" y="298" fill="#3a3631" font-size="16">Define the parser, implement operations, test errors.</text>
<rect x="312" y="317" width="540" height="48" rx="8" fill="#ffffff"/><text x="330" y="347" fill="#2d5f8a" font-size="14">Deliverable / implementation-plan.md</text>
<circle cx="275" cy="410" r="20" fill="#5a6a9c"/><text x="269" y="416" fill="#ffffff" font-size="16">C</text>
<text x="312" y="402" fill="#4a5a9c" font-size="15" font-weight="700">Coder</text><text x="312" y="430" fill="#3a3631" font-size="16">Ready to run the proposed verification command.</text>
<rect x="312" y="451" width="540" height="164" rx="10" fill="#272622" stroke="#a8802a"/>
<text x="332" y="481" fill="#a06000" font-size="15" font-weight="700">APPROVAL REQUEST · EXAMPLE</text><text x="332" y="512" fill="#272622" font-size="15">execute_code</text><text x="332" y="540" fill="#4a453e" font-size="15" font-family="Consolas,monospace">cargo test --workspace</text>
<rect x="332" y="562" width="101" height="34" rx="7" fill="#1f8a7a"/><text x="352" y="584" fill="#ffffff" font-size="14">Approve</text><rect x="447" y="562" width="101" height="34" rx="7" fill="#b9b2a6"/><text x="475" y="584" fill="#272622" font-size="14">Reject</text>
<rect x="254" y="649" width="618" height="43" rx="9" fill="#ffffff" stroke="#c9c3b8"/><text x="272" y="676" fill="#6b655c" font-size="14">Message the team or mention an agent…</text>
<text x="925" y="111" fill="#272622" font-size="17" font-weight="700">Task pipeline</text><text x="925" y="140" fill="#6b655c" font-size="13">Sequential crew / example</text>
<g font-size="15"><text x="925" y="198" fill="#0f7b6c">01  Plan · complete</text><text x="925" y="244" fill="#a06000">02  Build · awaiting approval</text><text x="925" y="290" fill="#4a453e">03  Review · pending</text></g>
<path d="M925 324H1174" stroke="#d6d0c6"/><text x="925" y="358" fill="#272622" font-size="15" font-weight="600">Workspace direction</text><g font-size="14" fill="#4a453e"><text x="925" y="390">Persistent channels</text><text x="925" y="420">Visible task progress</text><text x="925" y="450">Human tool approvals</text><text x="925" y="480">Shared deliverables</text></g>
<text x="30" y="743" fill="#4a453e" font-size="14">CONCEPT PREVIEW   /   Desktop shell exists. This layout is illustrative; starting execution from desktop remains follow-up work.</text>
</g>
</svg>