<title id="title">CowBot current local architecture</title><desc id="desc">CLI and Tauri desktop use the local client. Services persist data through cowbot-store to SQLite and coordinate agents and approvals. Agents call model and tool adapters. Events flow through cowbot-bus. Desktop execution launch and remote client remain future work.</desc>
