[package]
name = "cowbot-desktop"
version = "0.1.0"
description = "CowBot desktop application"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "cowbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cowbot-client = { path = "../../crates/cowbot-client" }
cowbot-core = { path = "../../crates/cowbot-core" }

[dev-dependencies]
tempfile = "3"

[workspace]
