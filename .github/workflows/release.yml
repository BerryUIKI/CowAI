name: Release desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: cowbot-windows
            args: --bundles nsis,msi
          - platform: macos-latest
            artifact: cowbot-macos
            args: --target universal-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            artifact: cowbot-linux
            args: --bundles deb,appimage
    steps:
      - uses: actions/checkout@v4

      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "The TAURI_SIGNING_PRIVATE_KEY secret is required to sign updater artifacts." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            pkg-config \
            libssl-dev

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Check tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the app version v${version}." >&2
            exit 1
          fi

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('CowBot {0}', github.ref_name) || '' }}
          releaseBody: |
            Unsigned CowBot desktop builds for Windows, macOS, and Linux.

            macOS may require allowing the app in System Settings. Windows may show a SmartScreen prompt. Verify downloads and report issues at https://github.com/BerryUIKI/CowBot/issues.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          retryAttempts: 3

      - name: Upload installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.sig

  updater-json:
    name: Publish update manifest
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match the app version v$version." >&2
            exit 1
          fi

          mkdir -p signatures
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --dir signatures --clobber

          find_asset() {
            local pattern="$1"
            local name
            name=$(find signatures -maxdepth 1 -type f -name "$pattern" -printf '%f\n' | head -n 1)
            if [ -z "$name" ]; then
              echo "No updater signature matched $pattern." >&2
              exit 1
            fi
            printf '%s\n' "$name"
          }

          windows_sig=$(find_asset '*_x64-setup.exe.sig')
          macos_sig=$(find_asset '*.app.tar.gz.sig')
          linux_sig=$(find_asset '*.AppImage.sig')

          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          for name in "${windows_sig%.sig}" "${macos_sig%.sig}" "${linux_sig%.sig}"; do
            if ! grep -Fxq "$name" <<< "$assets"; then
              echo "Missing updater artifact $name on the release." >&2
              exit 1
            fi
          done

          base="https://github.com/$REPO/releases/download/$TAG"
          release_url="https://github.com/$REPO/releases/tag/$TAG"

          jq -n \
            --arg version "$version" \
            --arg notes "Release notes: $release_url" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg windows_url "$base/${windows_sig%.sig}" \
            --arg windows_sig "$(cat "signatures/$windows_sig")" \
            --arg macos_url "$base/${macos_sig%.sig}" \
            --arg macos_sig "$(cat "signatures/$macos_sig")" \
            --arg linux_url "$base/${linux_sig%.sig}" \
            --arg linux_sig "$(cat "signatures/$linux_sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $windows_sig, url: $windows_url },
                "darwin-aarch64": { signature: $macos_sig, url: $macos_url },
                "darwin-x86_64": { signature: $macos_sig, url: $macos_url },
                "darwin-universal": { signature: $macos_sig, url: $macos_url },
                "linux-x86_64": { signature: $linux_sig, url: $linux_url }
              }
            }' > latest.json

          jq . latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
